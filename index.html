<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 12px 16px 32px;
      text-align: center;
    }
    .photo {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    .bio {
      max-width: 360px;
      margin: 18px auto 0;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 17px;
      line-height: 1.45;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 0.85rem;
      margin: 28px auto 0;
      padding: 0 8px;
      max-width: 360px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .page {
      max-width: 360px;
      margin: 0 auto;
      text-align: left;
      color: #d9c7b0;
      font-size: 15px;
      line-height: 1.5;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 12px;
      text-align: center;
    }
</style>
</head>
<body>
  <header>
    <a href="./">
      <img class="logo" src="./assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
    <main>
    <img class="photo" src="./assets/jenny.jpg?v=6" alt="Jenny — white third-gen Camaro" width="800" height="600" />
    <p class="bio">Hi, I'm Jenny. I may be over 40, but I don't really look my age. Mostly stock, 305 700R4</p>
    <nav class="cats" aria-label="Categories">
      <a href="./about/">About</a>
      <a href="./photos/">Photos</a>
      <a href="./projects/">Projects</a>
      <a href="./camaro/">Camaro</a>
      <a href="./links/">Links</a>
    </nav>
  </main>
</body>
</html>
