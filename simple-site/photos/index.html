<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Photos — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .photo {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    .thumbs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 360px;
      margin: 12px auto 0;
      padding: 0;
    }
    .thumb {
      display: inline-block;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      line-height: 0;
      overflow: hidden;
    }
    .thumb img {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
    }
    .thumb.is-active { border-color: #f48c06; }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .page h1, .album h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 12px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    a.cover-link { display: inline-block; line-height: 0; }
    a.blurb-link {
      color: #fff4e6;
      text-decoration: none;
    }
    a.blurb-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    a.slideshow-link {
      display: block;
      max-width: 360px;
      margin: 0 auto;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    a.slideshow-link:focus-visible {
      outline: 2px solid #f48c06;
      outline-offset: 6px;
      border-radius: 8px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px auto 0;
    }
    .photo-grid a {
      display: block;
      line-height: 0;
      border-radius: 6px;
      overflow: hidden;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      padding: 16px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      cursor: default;
    }
</style>
</head>
<body>
  <header>
    <a href="../">
      <img class="logo" src="../assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
<nav class="cats" aria-label="Categories">
      <a href="../">Home</a>
      <a href="../about/">About</a>
      <a href="../logs/">Logs</a>
      <a href="../photos/">Photos</a>
      <a href="../projects/">Projects</a>
      <a href="../camaro/">Camaro</a>
      <a href="../videos/">Videos</a>
      <a href="../links/">Links</a>
    </nav>
    <div class="page">
      <h1>Photos</h1>
      <p class="blurb">
        <a class="blurb-link" href="first-love/">So this was his first love, an 83 Z-28. I don't know what he saw in her.</a>
      </p>
      <a class="cover-link" href="first-love/">
        <img
          class="photo"
          src="../assets/photos/first-love/03.jpg?v=1"
          alt="83 Z-28"
          width="1400"
          height="947"
        />
      </a>
    </div>
  </main>
</body>
</html>
