<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>83 Z-28 — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .photo {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    .thumbs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 360px;
      margin: 12px auto 0;
      padding: 0;
    }
    .thumb {
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      line-height: 0;
      overflow: hidden;
    }
    .thumb img {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
    }
    .thumb.is-active { border-color: #f48c06; }
    .blurb {
      max-width: 360px;
      margin: 20px auto 0;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .page h1, .album h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 12px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    a.cover-link { display: inline-block; line-height: 0; }
    a.blurb-link {
      color: #fff4e6;
      text-decoration: none;
    }
    a.blurb-link:hover { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
  <header>
    <a href="../../">
      <img class="logo" src="../../assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
<nav class="cats" aria-label="Categories">
      <a href="../../">Home</a>
      <a href="../../about/">About</a>
      <a href="../../logs/">Logs</a>
      <a href="../../photos/">Photos</a>
      <a href="../../projects/">Projects</a>
      <a href="../../camaro/">Camaro</a>
      <a href="../../videos/">Videos</a>
      <a href="../../links/">Links</a>
    </nav>
    <div class="album">
      <a class="back" href="../">← Photos</a>
      <h1>83 Z-28</h1>
      <img
        id="hero"
        class="photo"
        src="../../assets/photos/first-love/03.jpg?v=1"
        alt="83 Z-28"
        width="1400"
        height="947"
      />
      <div class="thumbs" id="thumbs">
      <button type="button" class="thumb is-active" data-full="../../assets/photos/first-love/03.jpg?v=1" aria-label="Cover"><img src="../../assets/photos/first-love/03.jpg?v=1" alt="" loading="lazy" /></button>
      <button type="button" class="thumb" data-full="../../assets/photos/first-love/01.jpg?v=1" aria-label="Photo 1"><img src="../../assets/photos/first-love/01.jpg?v=1" alt="" loading="lazy" /></button>
      <button type="button" class="thumb" data-full="../../assets/photos/first-love/02.jpg?v=1" aria-label="Photo 2"><img src="../../assets/photos/first-love/02.jpg?v=1" alt="" loading="lazy" /></button>
      <button type="button" class="thumb" data-full="../../assets/photos/first-love/04.jpg?v=1" aria-label="Photo 4"><img src="../../assets/photos/first-love/04.jpg?v=1" alt="" loading="lazy" /></button>
      <button type="button" class="thumb" data-full="../../assets/photos/first-love/05.jpg?v=1" aria-label="Photo 5"><img src="../../assets/photos/first-love/05.jpg?v=1" alt="" loading="lazy" /></button>
      </div>
      <p class="blurb">So this was his first love, an 83 Z-28. I don't know what he saw in her.</p>
    </div>
  </main>
  <script>
    (function () {
      var DEFAULT = '../../assets/photos/first-love/03.jpg?v=1';
      var hero = document.getElementById('hero');
      var thumbs = document.getElementById('thumbs');
      function setHero(src, btn) {
        hero.src = src;
        thumbs.querySelectorAll('.thumb').forEach(function (b) {
          b.classList.toggle('is-active', b === btn);
        });
      }
      thumbs.addEventListener('click', function (e) {
        var btn = e.target.closest('.thumb');
        if (!btn) return;
        setHero(btn.getAttribute('data-full'), btn);
      });
    })();
  </script>
</body>
</html>
