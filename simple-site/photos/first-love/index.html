<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>1983 Camaro Z28 — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .photo {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    .thumbs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 360px;
      margin: 12px auto 0;
      padding: 0;
    }
    .thumb {
      display: inline-block;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #1a1220;
      line-height: 0;
      overflow: hidden;
    }
    .thumb.is-active { border-color: #f48c06; }
    .thumb img {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 12px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    a.album-link {
      display: block;
      max-width: 360px;
      margin: 0 auto;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    a.album-link:focus-visible {
      outline: 2px solid #f48c06;
      outline-offset: 6px;
      border-radius: 8px;
    }
    a.album-link .blurb {
      margin-bottom: 14px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: start;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
    }
</style>
</head>
<body>
  <header>
    <a href="/">
      <img class="logo" src="/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
<nav class="cats" aria-label="Categories">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/logs/">Logs</a>
      <a href="/photos/">Photos</a>
      <a href="/projects/">Projects</a>
      <a href="/camaro/">Camaro</a>
      <a href="/videos/">Videos</a>
      <a href="/links/">Links</a>
    </nav>
    <div class="grid-wrap">
      <a class="back" href="/photos/">← Photos</a>
      <p class="blurb">1983 Camaro Z28</p>
      <div class="photo-grid">
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/03.jpg?v=2" aria-label="83 Z-28 front — fullscreen">
        <img src="/assets/photos/first-love/grid-03.jpg?v=3" alt="83 Z-28 front" width="1400" height="947" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/01.jpg?v=2" aria-label="On the hood with the plates — fullscreen">
        <img src="/assets/photos/first-love/grid-01.jpg?v=3" alt="On the hood with the plates" width="1400" height="972" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/02.jpg?v=2" aria-label="Putting on the rear plate — fullscreen">
        <img src="/assets/photos/first-love/grid-02.jpg?v=3" alt="Putting on the rear plate" width="1400" height="958" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/04.jpg?v=2" aria-label="Interior with T-tops off — fullscreen">
        <img src="/assets/photos/first-love/grid-04.jpg?v=3" alt="Interior with T-tops off" width="1400" height="967" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/05.jpg?v=2" aria-label="Rear Z28 — fullscreen">
        <img src="/assets/photos/first-love/grid-05.jpg?v=3" alt="Rear Z28" width="1400" height="970" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/06.jpg?v=2" aria-label="From the back seat looking forward — fullscreen">
        <img src="/assets/photos/first-love/grid-06.jpg?v=3" alt="From the back seat looking forward" width="1400" height="918" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/07.jpg?v=2" aria-label="Standing by the open door — fullscreen">
        <img src="/assets/photos/first-love/grid-07.jpg?v=3" alt="Standing by the open door" width="1400" height="644" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/08.jpg?v=2" aria-label="Rear three-quarter on the rooftop lot — fullscreen">
        <img src="/assets/photos/first-love/grid-08.jpg?v=3" alt="Rear three-quarter on the rooftop lot" width="1400" height="644" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/09.jpg?v=2" aria-label="Side profile on the rooftop lot — fullscreen">
        <img src="/assets/photos/first-love/grid-09.jpg?v=3" alt="Side profile on the rooftop lot" width="1400" height="644" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/first-love/10.jpg?v=2" aria-label="Driving with the top off — fullscreen">
        <img src="/assets/photos/first-love/grid-10.jpg?v=3" alt="Driving with the top off" width="1400" height="909" decoding="async" />
      </button>
      </div>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <img id="lightbox-img" src="" alt="" />
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');
      function openFull(src, alt) {
        img.src = src;
        img.alt = alt || '';
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
      }
      document.querySelectorAll('.zoomable').forEach(function (el) {
        el.addEventListener('click', function () {
          var thumb = el.querySelector('img');
          openFull(el.getAttribute('data-full'), thumb ? thumb.alt : '');
        });
      });
      box.addEventListener('click', closeFull);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('is-open')) closeFull();
      });
    })();
  </script>
</body>
</html>
