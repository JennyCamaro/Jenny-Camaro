<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>1978 Camaro Z-28 — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: start;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      cursor: zoom-out;
      touch-action: pan-y;
    }
    .lightbox.is-open { display: flex; }
    .lightbox-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 8px 0 0;
      box-sizing: border-box;
      cursor: zoom-out;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .lightbox-hint {
      flex: 0 0 auto;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      letter-spacing: 0.02em;
      line-height: 1.3;
      pointer-events: none;
      user-select: none;
    }
    .lightbox-close {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 3;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 28px;
      line-height: 44px;
      cursor: pointer;
      opacity: 0.75;
      -webkit-tap-highlight-color: transparent;
    }
    .lightbox-close:active { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <img class="logo" src="/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/logs/">Logs</a>
      <a href="/photos/">Photos</a>
      <a href="/projects/">Projects</a>
      <a href="/camaro/">Camaro</a>
      <a href="/links/">Links</a>
    </nav>
    <div class="grid-wrap">
      <a class="back" id="album-back-top" href="/photos/">← Photos</a>
      <p class="blurb">1978 Camaro Z-28</p>
      <div class="photo-grid">
      
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/01.jpg?v=1" aria-label="1978 Z-28 front with kid — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-01.jpg?v=1" alt="Kid by the front of the red 1978 Camaro Z-28" width="1600" height="1054" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/02.jpg?v=1" aria-label="1978 Z-28 rear three-quarter — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-02.jpg?v=1" alt="1978 Camaro Z-28 rear three-quarter by the fence" width="1600" height="1113" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/06.jpg?v=1" aria-label="On the hood of the 1978 Z-28 — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-06.jpg?v=1" alt="On the hood of the 1978 Camaro Z-28" width="1320" height="1019" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/03.jpg?v=1" aria-label="Driver seat with door open — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-03.jpg?v=1" alt="In the driver's seat with the door open" width="1600" height="1081" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/04.jpg?v=1" aria-label="1978 Z-28 front with plates — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-04.jpg?v=1" alt="Front of the 1978 Camaro Z-28 with Ontario plates" width="1600" height="1121" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/05.jpg?v=1" aria-label="1978 Z-28 hood off in the garage — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-05.jpg?v=1" alt="1978 Camaro Z-28 on jack stands with the hood off" width="1600" height="1061" decoding="async" />
      </button>
      

      </div>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <div class="lightbox-stage" id="lightbox-stage">
      <img id="lightbox-img" src="" alt="" />
    </div>
    <div class="lightbox-hint" id="lightbox-hint" aria-live="polite"></div>
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var stage = document.getElementById('lightbox-stage');
      var img = document.getElementById('lightbox-img');
      var hint = document.getElementById('lightbox-hint');
      var btnClose = document.getElementById('lightbox-close');
      var items = Array.prototype.slice.call(document.querySelectorAll('.zoomable'));
      var index = 0;
      var touchX = null;
      var touchY = null;
      var swiped = false;

      function updateHint() {
        if (!items.length) {
          hint.textContent = '';
          return;
        }
        hint.textContent = 'swipe  ·  ' + (index + 1) + ' / ' + items.length;
      }
      function show(i) {
        if (!items.length) return;
        index = (i + items.length) % items.length;
        var el = items[index];
        var thumb = el.querySelector('img');
        img.src = el.getAttribute('data-full');
        img.alt = (thumb && thumb.alt) || '';
        updateHint();
      }
      function openAt(i) {
        show(i);
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
        touchX = null;
        touchY = null;
        swiped = false;
      }
      function prev() { show(index - 1); }
      function next() { show(index + 1); }

      items.forEach(function (el, i) {
        el.addEventListener('click', function () { openAt(i); });
      });
      btnClose.addEventListener('click', function (e) {
        e.stopPropagation();
        closeFull();
      });
      stage.addEventListener('click', function (e) {
        if (swiped) { swiped = false; return; }
        var rect = stage.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var edge = Math.max(72, rect.width * 0.28);
        if (x < edge) prev();
        else if (x > rect.width - edge) next();
        else closeFull();
      });
      document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeFull();
        else if (e.key === 'ArrowLeft') prev();
        else if (e.key === 'ArrowRight') next();
      });
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
        swiped = false;
      }, { passive: true });
      stage.addEventListener('touchend', function (e) {
        if (touchX === null || !e.changedTouches.length) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - touchX;
        var dy = t.clientY - touchY;
        touchX = null;
        touchY = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          swiped = true;
          if (dx > 0) prev();
          else next();
        }
      }, { passive: true });
      stage.addEventListener('touchcancel', function () {
        touchX = null;
        touchY = null;
      });
    })();
  </script>

  <script>
    (function () {
      var a = document.getElementById('album-back-top');
      if (!a) return;

      function pathOf(url) {
        try {
          var u = new URL(url, location.href);
          if (u.origin !== location.origin) return null;
          var p = u.pathname.replace(/\/index\.html$/, '/');
          if (!p.endsWith('/')) p += '/';
          return p;
        } catch (e) {
          return null;
        }
      }

      function sourceFrom() {
        var q = new URLSearchParams(location.search).get('from');
        if (q === 'logs' || q === 'home') return q;
        var p = pathOf(document.referrer);
        if (!p) return null;
        if (p === '/logs/') return 'logs';
        if (p === '/') return 'home';
        return null;
      }

      var from = sourceFrom();
      if (!from) return;

      a.textContent = '\u2190 back';
      a.setAttribute('aria-label', 'Back');
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var refPath = pathOf(document.referrer);
        var canBack = (from === 'logs' && refPath === '/logs/') ||
                      (from === 'home' && refPath === '/');
        if (canBack && window.history.length > 1) {
          history.back();
          return;
        }
        location.href = from === 'home' ? '/' : '/logs/';
      });
    })();
  </script>

</body>
</html>
