<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>1978 Camaro Z-28 — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: start;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      touch-action: pan-y;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .lightbox-nav {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 22%;
      max-width: 88px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 42px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.55;
      -webkit-tap-highlight-color: transparent;
      z-index: 2;
    }
    .lightbox-nav:active { opacity: 0.95; }
    .lightbox-prev { left: 0; }
    .lightbox-next { right: 0; }
    .lightbox-close {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 3;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 28px;
      line-height: 44px;
      cursor: pointer;
      opacity: 0.75;
      -webkit-tap-highlight-color: transparent;
    }
    .lightbox-close:active { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <img class="logo" src="/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/logs/">Logs</a>
      <a href="/photos/">Photos</a>
      <a href="/projects/">Projects</a>
      <a href="/camaro/">Camaro</a>
      <a href="/links/">Links</a>
    </nav>
    <div class="grid-wrap">
      <a class="back" href="/photos/">← Photos</a>
      <p class="blurb">1978 Camaro Z-28</p>
      <div class="photo-grid">
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/01.jpg?v=1" aria-label="1978 Z-28 front with kid — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-01.jpg?v=1" alt="Kid by the front of the red 1978 Camaro Z-28" width="1600" height="1054" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/02.jpg?v=1" aria-label="1978 Z-28 rear three-quarter — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-02.jpg?v=1" alt="1978 Camaro Z-28 rear three-quarter by the fence" width="1600" height="1113" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/03.jpg?v=1" aria-label="Driver seat with door open — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-03.jpg?v=1" alt="In the driver's seat with the door open" width="1600" height="1081" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/04.jpg?v=1" aria-label="1978 Z-28 front with plates — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-04.jpg?v=1" alt="Front of the 1978 Camaro Z-28 with Ontario plates" width="1600" height="1121" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/05.jpg?v=1" aria-label="1978 Z-28 hood off in the garage — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-05.jpg?v=1" alt="1978 Camaro Z-28 on jack stands with the hood off" width="1600" height="1061" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/1978-camaro-z28/06.jpg?v=1" aria-label="On the hood of the 1978 Z-28 — fullscreen">
        <img src="/assets/photos/1978-camaro-z28/grid-06.jpg?v=1" alt="On the hood of the 1978 Camaro Z-28" width="1320" height="1019" decoding="async" />
      </button>

      </div>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
    <img id="lightbox-img" src="" alt="" />
    <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');
      var btnPrev = document.getElementById('lightbox-prev');
      var btnNext = document.getElementById('lightbox-next');
      var btnClose = document.getElementById('lightbox-close');
      var items = Array.prototype.slice.call(document.querySelectorAll('.zoomable'));
      var index = 0;
      var touchX = null;
      var touchY = null;

      function show(i) {
        if (!items.length) return;
        index = (i + items.length) % items.length;
        var el = items[index];
        var thumb = el.querySelector('img');
        img.src = el.getAttribute('data-full');
        img.alt = (thumb && thumb.alt) || '';
      }
      function openAt(i) {
        show(i);
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
        touchX = null;
        touchY = null;
      }
      function prev() { show(index - 1); }
      function next() { show(index + 1); }

      items.forEach(function (el, i) {
        el.addEventListener('click', function () { openAt(i); });
      });
      btnPrev.addEventListener('click', function (e) {
        e.stopPropagation();
        prev();
      });
      btnNext.addEventListener('click', function (e) {
        e.stopPropagation();
        next();
      });
      btnClose.addEventListener('click', function (e) {
        e.stopPropagation();
        closeFull();
      });
      box.addEventListener('click', function (e) {
        if (e.target === box) closeFull();
      });
      document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeFull();
        else if (e.key === 'ArrowLeft') prev();
        else if (e.key === 'ArrowRight') next();
      });
      box.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
      }, { passive: true });
      box.addEventListener('touchmove', function (e) {
        if (touchX === null || e.touches.length !== 1) return;
        var dx = e.touches[0].clientX - touchX;
        var dy = e.touches[0].clientY - touchY;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          if (dx > 0) prev();
          else next();
          touchX = null;
          touchY = null;
        }
      }, { passive: true });
      box.addEventListener('touchend', function () {
        touchX = null;
        touchY = null;
      });
    })();
  </script>
</body>
</html>
