<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>1978 Camaro Z-28 — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: start;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <a href="/Jenny-Camaro/">
      <img class="logo" src="/Jenny-Camaro/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="/Jenny-Camaro/">Home</a>
      <a href="/Jenny-Camaro/about/">About</a>
      <a href="/Jenny-Camaro/logs/">Logs</a>
      <a href="/Jenny-Camaro/photos/">Photos</a>
      <a href="/Jenny-Camaro/projects/">Projects</a>
      <a href="/Jenny-Camaro/camaro/">Camaro</a>
      <a href="/Jenny-Camaro/videos/">Videos</a>
      <a href="/Jenny-Camaro/links/">Links</a>
    </nav>
    <div class="grid-wrap">
      <a class="back" href="/Jenny-Camaro/photos/">← Photos</a>
      <p class="blurb">1978 Camaro Z-28</p>
      <div class="photo-grid">
      <button type="button" class="zoomable" data-full="/Jenny-Camaro/assets/photos/1978-camaro-z28/01.jpg?v=1" aria-label="1978 Z-28 front with kid — fullscreen">
        <img src="/Jenny-Camaro/assets/photos/1978-camaro-z28/grid-01.jpg?v=1" alt="Kid by the front of the red 1978 Camaro Z-28" width="1600" height="1054" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/Jenny-Camaro/assets/photos/1978-camaro-z28/02.jpg?v=1" aria-label="1978 Z-28 rear three-quarter — fullscreen">
        <img src="/Jenny-Camaro/assets/photos/1978-camaro-z28/grid-02.jpg?v=1" alt="1978 Camaro Z-28 rear three-quarter by the fence" width="1600" height="1113" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/Jenny-Camaro/assets/photos/1978-camaro-z28/03.jpg?v=1" aria-label="Driver seat with door open — fullscreen">
        <img src="/Jenny-Camaro/assets/photos/1978-camaro-z28/grid-03.jpg?v=1" alt="In the driver's seat with the door open" width="1600" height="1081" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/Jenny-Camaro/assets/photos/1978-camaro-z28/04.jpg?v=1" aria-label="1978 Z-28 front with plates — fullscreen">
        <img src="/Jenny-Camaro/assets/photos/1978-camaro-z28/grid-04.jpg?v=1" alt="Front of the 1978 Camaro Z-28 with Ontario plates" width="1600" height="1121" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/Jenny-Camaro/assets/photos/1978-camaro-z28/05.jpg?v=1" aria-label="1978 Z-28 hood off in the garage — fullscreen">
        <img src="/Jenny-Camaro/assets/photos/1978-camaro-z28/grid-05.jpg?v=1" alt="1978 Camaro Z-28 on jack stands with the hood off" width="1600" height="1061" decoding="async" />
      </button>
      </div>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <img id="lightbox-img" src="" alt="" />
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');
      function openFull(src, alt) {
        img.src = src;
        img.alt = alt || '';
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
      }
      document.querySelectorAll('.zoomable').forEach(function (el) {
        el.addEventListener('click', function () {
          openFull(el.getAttribute('data-full'), el.querySelector('img').alt);
        });
      });
      box.addEventListener('click', closeFull);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('is-open')) closeFull();
      });
    })();
  </script>
</body>
</html>
