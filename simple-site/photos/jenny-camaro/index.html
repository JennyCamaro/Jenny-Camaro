<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Jenny Camaro — Photos</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: start;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <img class="logo" src="/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/logs/">Logs</a>
      <a href="/photos/">Photos</a>
      <a href="/projects/">Projects</a>
      <a href="/camaro/">Camaro</a>
      <a href="/links/">Links</a>
    </nav>
    <div class="grid-wrap">
      <a class="back" href="/photos/">← Photos</a>
      <p class="blurb">Jenny Camaro</p>
      <div class="photo-grid">
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/01.jpg?v=1" aria-label="Jenny in the rain — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-01.jpg?v=1" alt="Jenny — white Camaro in a wet parking lot" width="1320" height="977" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/02.jpg?v=1" aria-label="Front interior — red and orange CAMARO seats — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-02.jpg?v=1" alt="Jenny front seats with CAMARO cloth" width="711" height="900" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/03.jpg?v=1" aria-label="Rear CAMARO bucket seats — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-03.jpg?v=1" alt="Jenny rear seats with CAMARO cloth" width="688" height="900" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/04.jpg?v=1" aria-label="Interior from the passenger door — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-04.jpg?v=1" alt="Jenny interior through the open passenger door" width="718" height="900" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/05.jpg?v=1" aria-label="White Camaro with 17 on the hood — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-05.jpg?v=1" alt="Jenny — white Camaro number 17" width="662" height="900" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/06.jpg?v=1" aria-label="Dash and steering wheel — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-06.jpg?v=1" alt="Jenny dash gauges and steering wheel" width="900" height="684" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/07.jpg?v=1" aria-label="On the flatbed at the intersection — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-07.jpg?v=1" alt="Jenny on a flatbed at Huron Street" width="900" height="482" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/08.jpg?v=1" aria-label="Front in the parking garage — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-08.jpg?v=1" alt="Jenny in the underground garage — black hood stripes" width="900" height="682" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/09.jpg?v=1" aria-label="Rear taillight glowing — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-09.jpg?v=1" alt="Jenny left taillight lit" width="900" height="678" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/10.jpg?v=1" aria-label="Street profile with T-tops — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-10.jpg?v=1" alt="Jenny parked on the street with T-tops" width="900" height="466" decoding="async" />
      </button>
      <button type="button" class="zoomable" data-full="/assets/photos/jenny-camaro/11.jpg?v=1" aria-label="Rear wheel close-up — fullscreen">
        <img src="/assets/photos/jenny-camaro/grid-11.jpg?v=1" alt="Jenny rear Z28 wheel and gold trim" width="900" height="677" decoding="async" />
      </button>
      </div>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <img id="lightbox-img" src="" alt="" />
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');
      function openFull(src, alt) {
        img.src = src;
        img.alt = alt || '';
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
      }
      document.querySelectorAll('.zoomable').forEach(function (el) {
        el.addEventListener('click', function () {
          openFull(el.getAttribute('data-full'), el.querySelector('img').alt);
        });
      });
      box.addEventListener('click', closeFull);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('is-open')) closeFull();
      });
    })();
  </script>
</body>
</html>
