<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Videos — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .photo {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    .thumbs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 360px;
      margin: 12px auto 0;
      padding: 0;
    }
    .thumb {
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      line-height: 0;
      overflow: hidden;
    }
    .thumb img {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
    }
    .thumb.is-active { border-color: #f48c06; }
    .bio {
      max-width: 360px;
      margin: 36px auto 0;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 17px;
      line-height: 1.45;
      text-align: center;
    }
    .page {
      max-width: 360px;
      margin: 0 auto;
      text-align: left;
      color: #d9c7b0;
      font-size: 15px;
      line-height: 1.5;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 12px;
      text-align: center;
    }
    .embed {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 12px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #1a0f24;
    }
    .embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .vid-cap {
      margin: 10px 0 0;
      text-align: center;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.4;
    }
    .page a.ext {
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .vid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 8px 24px;
      text-align: center;
    }
    .vid-wrap h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 16px;
    }
    .vid-player {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      border-radius: 8px;
      background: #1a0f24;
    }
</style>
</head>
<body>
  <header>
    <a href="../">
      <img class="logo" src="../assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="../">Home</a>
      <a href="../about/">About</a>
      <a href="../logs/">Logs</a>
      <a href="../photos/">Photos</a>
      <a href="../projects/">Projects</a>
      <a href="../camaro/">Camaro</a>
      <a href="../videos/">Videos</a>
      <a href="../links/">Links</a>
    </nav>
    <div class="vid-wrap">
      <h1>Videos</h1>
      <video class="vid-player" controls playsinline preload="metadata" poster="../assets/videos/preview-poster.jpg?v=1" src="../assets/videos/preview.mp4?v=2">
        Sorry, your browser can&apos;t play this video.
      </video>
    </div>
  </main>
</body>
</html>
