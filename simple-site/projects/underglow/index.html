<!DOCTYPE html>

  <title>Underglow — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      text-align: left;
      color: #fff4e6;
      font-size: 15px;
      line-height: 1.55;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin: 8px 0 16px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 16px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .copy {
      max-width: 720px;
      margin: 0 0 1rem;
    }
    .copy p { margin: 0 0 0.95em; }
    .copy p:last-child { margin-bottom: 0; }
    .project-video {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      margin: 0 auto 1rem;
      border-radius: 8px;
      background: #1a1220;
    }
    a.ext {
      color: #6eb6ff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../">
      <img class="logo" src="../../assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />

      <a href="../../links/">Links</a>
