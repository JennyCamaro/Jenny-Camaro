<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Fan Shroud — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      text-align: left;
      color: #fff4e6;
      font-size: 15px;
      line-height: 1.55;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin: 8px 0 16px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 16px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .collage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      max-width: 720px;
      margin: 0 auto 16px;
    }
    .collage img {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: cover;
      border-radius: 8px;
      cursor: zoom-in;
    }
    .collage .wide {
      grid-column: 1 / -1;
      aspect-ratio: 4 / 3;
    }
    .collage .tile {
      aspect-ratio: 3 / 4;
    }
    .collage .portrait {
      grid-column: 1 / -1;
      aspect-ratio: 3 / 4;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      padding: 16px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      cursor: zoom-out;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../../">
      <img class="logo" src="../../../assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="../../../">Home</a>
      <a href="../../../about/">About</a>
      <a href="../../../logs/">Logs</a>
      <a href="../../../photos/">Photos</a>
      <a href="../../">Projects</a>
      <a href="../../../links/">Links</a>
    </nav>
    <div class="page">
      <a class="back" id="project-back-top" href="../">← Radiator</a>
      <h1>Fan Shroud</h1>
      <div class="collage">
        <img class="wide zoomable" src="../../../assets/projects/radiator/shroud/01.jpg?v=1" data-full="../../../assets/projects/radiator/shroud/01.jpg?v=1" alt="Modified fan shroud on the workbench" width="1760" height="1320" />
        <img class="tile zoomable" src="../../../assets/projects/radiator/shroud/02.jpg?v=1" data-full="../../../assets/projects/radiator/shroud/02.jpg?v=1" alt="Dremel cutting the fan shroud" width="1320" height="1760" />
        <img class="tile zoomable" src="../../../assets/projects/radiator/shroud/03.jpg?v=1" data-full="../../../assets/projects/radiator/shroud/03.jpg?v=1" alt="Cut corner of the fan shroud" width="1320" height="1760" />
        <img class="wide zoomable" src="../../../assets/projects/radiator/shroud/04.jpg?v=1" data-full="../../../assets/projects/radiator/shroud/04.jpg?v=1" alt="Fan shroud held at the front corner of the Camaro" width="1760" height="1320" />
        <img class="wide zoomable" src="../../../assets/projects/radiator/shroud/05.jpg?v=1" data-full="../../../assets/projects/radiator/shroud/05.jpg?v=1" alt="Cut edge of the fan shroud at the Camaro corner" width="1760" height="1320" />
        <img class="portrait zoomable" src="../../../assets/projects/radiator/shroud/06.jpg?v=1" data-full="../../../assets/projects/radiator/shroud/06.jpg?v=1" alt="Fan shroud installed in the engine bay" width="1320" height="1760" />
      </div>
      <a class="back" href="../">back to radiator</a>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
    <img id="lightbox-img" src="" alt="" />
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');
      function openFull(src, alt) {
        img.src = src;
        img.alt = alt || '';
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
      }
      document.querySelectorAll('.zoomable').forEach(function (el) {
        el.addEventListener('click', function () {
          openFull(el.getAttribute('data-full') || el.src, el.alt || '');
        });
      });
      box.addEventListener('click', closeFull);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('is-open')) closeFull();
      });
    })();
  </script>
  <script>
    (function () {
      var links = document.querySelectorAll('a.back');
      if (!links.length) return;

      function pathOf(url) {
        if (!url) return null;
        try {
          var u = new URL(url, location.href);
          if (u.origin !== location.origin) return null;
          var p = u.pathname.replace(/\/index\.html$/, '/');
          if (!p.endsWith('/')) p += '/';
          return p;
        } catch (e) {
          return null;
        }
      }

      var fromRadiator = pathOf(document.referrer) === '/projects/radiator/';
      links.forEach(function (a) {
        a.addEventListener('click', function (e) {
          if (fromRadiator && window.history.length > 1) {
            e.preventDefault();
            history.back();
          }
        });
      });
    })();
  </script>
</body>
</html>
