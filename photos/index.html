<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Photos — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .page {
      max-width: 360px;
      margin: 0 auto;
      text-align: left;
      color: #d9c7b0;
      font-size: 15px;
      line-height: 1.5;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 16px;
      text-align: center;
    }
    .album-entry {
      margin: 0 0 1.75rem;
    }
    .album-row {
      display: flex;
      align-items: center;
      gap: 16px;
      max-width: 360px;
      margin: 0;
      padding: 0 4px;
      text-align: left;
      text-decoration: none;
      color: inherit;
    }
    .album-thumb {
      flex: 0 0 107px;
      width: 107px;
      height: 107px;
      border-radius: 8px;
      object-fit: cover;
      display: block;
      background: #1a1220;
    }
    .album-copy {
      color: #fff4e6;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.25;
    }
    .album-row:hover .album-copy,
    .album-row:focus .album-copy {
      text-decoration: underline;
      text-underline-offset: 5px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <a href="/Jenny-Camaro/">
      <img class="logo" src="/Jenny-Camaro/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
    <nav class="cats" aria-label="Categories">
      <a href="/Jenny-Camaro/">Home</a>
      <a href="/Jenny-Camaro/about/">About</a>
      <a href="/Jenny-Camaro/logs/">Logs</a>
      <a href="/Jenny-Camaro/photos/">Photos</a>
      <a href="/Jenny-Camaro/projects/">Projects</a>
      <a href="/Jenny-Camaro/camaro/">Camaro</a>
      <a href="/Jenny-Camaro/videos/">Videos</a>
      <a href="/Jenny-Camaro/links/">Links</a>
    </nav>
    <div class="page">
      <h1>Photos</h1>
      <article class="album-entry">
        <a class="album-row" href="/Jenny-Camaro/photos/1978-camaro-z28/" aria-label="Open 1978 Camaro Z-28 photos">
          <img
            class="album-thumb"
            src="/Jenny-Camaro/assets/photos/1978-camaro-z28/list-thumb.jpg?v=1"
            alt="1978 Camaro Z-28"
            width="640"
            height="640"
          />
          <span class="album-copy">1978 Camaro Z-28</span>
        </a>
      </article>
      <article class="album-entry">
        <a class="album-row" href="/Jenny-Camaro/photos/first-love/" aria-label="Open 83 Z-28 photos">
          <img
            class="album-thumb"
            src="/Jenny-Camaro/assets/photos/first-love/list-thumb.jpg?v=1"
            alt="83 Z-28"
            width="640"
            height="640"
          />
          <span class="album-copy">So this was his first love, an 83 Z-28. I don't know what he saw in her.</span>
        </a>
      </article>
    </div>
  </main>
</body>
</html>
