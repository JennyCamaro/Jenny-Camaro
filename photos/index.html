<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0610" />
  <title>Photos — Jenny Camaro</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0610;
      color: #fff4e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px 16px 4px;
      text-align: center;
    }
    header a { display: inline-block; line-height: 0; }
    .logo {
      display: block;
      width: 240px;
      max-width: 72vw;
      height: auto;
      margin: 0 auto;
    }
    main {
      padding: 8px 16px 40px;
      text-align: center;
    }
    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .photo {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    .thumbs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 360px;
      margin: 12px auto 0;
      padding: 0;
    }
    .thumb {
      display: inline-block;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #1a1220;
      line-height: 0;
      overflow: hidden;
    }
    .thumb.is-active { border-color: #f48c06; }
    .thumb img {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .page h1 {
      color: #fff4e6;
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 12px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    a.album-link {
      display: block;
      max-width: 360px;
      margin: 0 auto;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    a.album-link:focus-visible {
      outline: 2px solid #f48c06;
      outline-offset: 6px;
      border-radius: 8px;
    }
    a.album-link .blurb {
      margin-bottom: 14px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: start;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
    }
</style>
</head>
<body>
  <header>
    <a href="/Jenny-Camaro/">
      <img class="logo" src="/Jenny-Camaro/assets/logo.png?v=2" alt="Jenny Camaro" width="600" height="259" />
    </a>
  </header>
  <main>
<nav class="cats" aria-label="Categories">
      <a href="/Jenny-Camaro/">Home</a>
      <a href="/Jenny-Camaro/about/">About</a>
      <a href="/Jenny-Camaro/logs/">Logs</a>
      <a href="/Jenny-Camaro/photos/">Photos</a>
      <a href="/Jenny-Camaro/projects/">Projects</a>
      <a href="/Jenny-Camaro/camaro/">Camaro</a>
      <a href="/Jenny-Camaro/videos/">Videos</a>
      <a href="/Jenny-Camaro/links/">Links</a>
    </nav>
    <div class="page">
      <h1>Photos</h1>
      <a class="album-link" href="/Jenny-Camaro/photos/first-love/" aria-label="Open 83 Z-28 photos">
        <p class="blurb">So this was his first love, an 83 Z-28. I don't know what he saw in her.</p>
        <img
          class="photo"
          src="/Jenny-Camaro/assets/photos/first-love/03.jpg?v=2"
          alt="83 Z-28"
          width="1400"
          height="947"
        />
        <div class="thumbs">
        <span class="thumb is-active" aria-hidden="true"><img src="/Jenny-Camaro/assets/photos/first-love/tiles/03.jpg?v=1" alt="" width="480" height="480" /></span>
        <span class="thumb" aria-hidden="true"><img src="/Jenny-Camaro/assets/photos/first-love/tiles/01.jpg?v=1" alt="" width="480" height="480" /></span>
        <span class="thumb" aria-hidden="true"><img src="/Jenny-Camaro/assets/photos/first-love/tiles/02.jpg?v=1" alt="" width="480" height="480" /></span>
        <span class="thumb" aria-hidden="true"><img src="/Jenny-Camaro/assets/photos/first-love/tiles/04.jpg?v=1" alt="" width="480" height="480" /></span>
        <span class="thumb" aria-hidden="true"><img src="/Jenny-Camaro/assets/photos/first-love/tiles/05.jpg?v=1" alt="" width="480" height="480" /></span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
