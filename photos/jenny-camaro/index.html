    .logo {

    main {
      padding: 8px 16px 40px;

    nav.cats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 0.9rem;
      margin: 12px auto 16px;
      padding: 0 8px;
      max-width: 400px;
    }
    nav.cats a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    nav.cats a:hover,
    nav.cats a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .blurb {
      max-width: 360px;
      margin: 0 auto 14px;
      padding: 0 8px;
      color: #fff4e6;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin: 0 0 8px;
      color: #f48c06;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 15px;
    }
    .grid-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 4px 24px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px auto 0;
      align-items: stretch;
    }
    .photo-grid button {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1220;
      cursor: zoom-in;
      line-height: 0;
    }
    .photo-grid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 6px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.96);
      padding: 0;
      box-sizing: border-box;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      cursor: zoom-out;
      touch-action: pan-y;
    }
    .lightbox.is-open { display: flex; }
    .lightbox-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 8px 0 0;
      box-sizing: border-box;
      cursor: zoom-out;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .lightbox-hint {
      flex: 0 0 auto;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      letter-spacing: 0.02em;
      line-height: 1.3;
      pointer-events: none;
      user-select: none;
    }
    .lightbox-close {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 3;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 28px;
      line-height: 44px;
      cursor: pointer;
      opacity: 0.75;
      -webkit-tap-highlight-color: transparent;
    }
    .lightbox-close:active { opacity: 1; }
  </style>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <div class="lightbox-stage" id="lightbox-stage">
      <img id="lightbox-img" src="" alt="" />
    </div>

  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var stage = document.getElementById('lightbox-stage');
      var img = document.getElementById('lightbox-img');
      var hint = document.getElementById('lightbox-hint');
      var btnClose = document.getElementById('lightbox-close');
      var items = Array.prototype.slice.call(document.querySelectorAll('.zoomable'));
      var index = 0;
      var touchX = null;
      var touchY = null;
      var swiped = false;

      function updateHint() {
        if (!items.length) {
          hint.textContent = '';
          return;
        }
        hint.textContent = 'swipe  ·  ' + (index + 1) + ' / ' + items.length;
      }
      function show(i) {
        if (!items.length) return;
        index = (i + items.length) % items.length;
        var el = items[index];
        var thumb = el.querySelector('img');
        img.src = el.getAttribute('data-full');
        img.alt = (thumb && thumb.alt) || '';
        updateHint();
      }
      function openAt(i) {
        show(i);
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeFull() {
        box.classList.remove('is-open');
        img.src = '';
        document.body.style.overflow = '';
        touchX = null;
        touchY = null;
        swiped = false;
      }
      function prev() { show(index - 1); }
      function next() { show(index + 1); }

      items.forEach(function (el, i) {
        el.addEventListener('click', function () { openAt(i); });
      });
      btnClose.addEventListener('click', function (e) {
        e.stopPropagation();
        closeFull();
      });
      stage.addEventListener('click', function (e) {
        if (swiped) { swiped = false; return; }
        var rect = stage.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var edge = Math.max(72, rect.width * 0.28);
        if (x < edge) prev();
        else if (x > rect.width - edge) next();
        else closeFull();
      });
      document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeFull();
        else if (e.key === 'ArrowLeft') prev();
        else if (e.key === 'ArrowRight') next();
      });
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
        swiped = false;
      }, { passive: true });
      stage.addEventListener('touchend', function (e) {
        if (touchX === null || !e.changedTouches.length) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - touchX;
        var dy = t.clientY - touchY;
        touchX = null;
        touchY = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          swiped = true;
          if (dx > 0) prev();
          else next();
        }
      }, { passive: true });
      stage.addEventListener('touchcancel', function () {
        touchX = null;
        touchY = null;
      });
    })();
  </script>

  <script>
    (function () {
      var a = document.getElementById('album-back-top');
      if (!a) return;

      function pathOf(url) {
        try {
          var u = new URL(url, location.href);
          if (u.origin !== location.origin) return null;
          var p = u.pathname.replace(/\/index\.html$/, '/');
          if (!p.endsWith('/')) p += '/';
          return p;
        } catch (e) {
          return null;
        }
      }

      function sourceFrom() {
        var q = new URLSearchParams(location.search).get('from');
        if (q === 'logs' || q === 'home') return q;
        var p = pathOf(document.referrer);
        if (!p) return null;
        if (p === '/logs/') return 'logs';
        if (p === '/') return 'home';
        return null;
      }

      var from = sourceFrom();
      if (!from) return;

      a.textContent = '\u2190 back';
      a.setAttribute('aria-label', 'Back');
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var refPath = pathOf(document.referrer);
        var canBack = (from === 'logs' && refPath === '/logs/') ||
                      (from === 'home' && refPath === '/');
        if (canBack && window.history.length > 1) {
          history.back();
          return;
        }
        location.href = from === 'home' ? '/' : '/logs/';
      });
    })();
  </script>
